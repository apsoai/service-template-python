name: secret-scan

# Prevent hardcoded provider credentials from shipping in the scaffolded
# template (and, since this repo is cloned verbatim, in every user service).
# See apsoai/apso-platform-server#151.

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: No hardcoded credentials in the scaffolded template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: bash scripts/secret-scan.sh
