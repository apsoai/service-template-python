services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: apso
      DATABASE_PASSWORD: apso
      DATABASE_NAME: apso
      # The service connects with DATABASE_URL; DATABASE_SYNC creates the tables.
      DATABASE_URL: postgresql+asyncpg://apso:apso@postgres:5432/apso
      DATABASE_SYNC: "true"
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      # The service's API key and the local flag (detailed 401 messages).
      # Compose reads both from .env, where "apso init" and "apso dev" write
      # them. With no key the service refuses every request but /health.
      APSO_API_KEY: ${APSO_API_KEY:-}
      APSO_LOCAL: ${APSO_LOCAL:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apso
      POSTGRES_PASSWORD: apso
      POSTGRES_DB: apso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apso"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
