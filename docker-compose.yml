services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: apso
      DATABASE_PASSWORD: apso
      DATABASE_NAME: apso
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apso
      POSTGRES_PASSWORD: apso
      POSTGRES_DB: apso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apso"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
